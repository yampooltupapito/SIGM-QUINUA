<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{admin/admin-layout}">
<head>
    <title th:text="'Editar: ' + ${sereno.codigoInterno} + ' | SIGM-QUINUA'">Editar Efectivo | SIGM-QUINUA</title>
</head>
<body>
<div layout:fragment="content" class="max-w-4xl mx-auto space-y-6">

    <!-- Encabezado y Breadcrumb -->
    <div class="border-b border-theme pb-4">
        <div class="flex items-center space-x-2 text-xs text-slate-400 mb-1">
            <a th:href="@{/dashboard/serenazgo/personal}" class="hover:text-indigo-400 transition-colors">Personal de Serenazgo</a>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-500"></i>
            <a th:href="@{/dashboard/serenazgo/personal/{id}(id=${sereno.id})}" th:text="${sereno.codigoInterno}" class="hover:text-indigo-400 font-mono">SER-000001</a>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-500"></i>
            <span class="text-slate-300">Editar Ficha</span>
        </div>
        <h1 class="text-xl md:text-2xl font-bold text-white tracking-tight flex items-center space-x-2.5">
            <i data-lucide="edit-3" class="w-6 h-6 text-amber-400"></i>
            <span th:text="'Editar Ficha: ' + ${sereno.nombreCompleto}">Editar Efectivo</span>
        </h1>
        <p class="text-xs text-slate-400 mt-1 font-mono" th:text="'Código Interno: ' + ${sereno.codigoInterno} + ' | DNI: ' + ${sereno.numeroDocumentoEnmascarado}">
            Código: SER-000001
        </p>
    </div>

    <!-- Alertas Flash -->
    <div th:if="${mensajeError}" class="p-4 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs flex items-center space-x-3">
        <i data-lucide="alert-octagon" class="w-5 h-5 flex-shrink-0"></i>
        <span th:text="${mensajeError}">Error</span>
    </div>

    <!-- Formulario de Edición -->
    <div class="bg-card border border-theme rounded-2xl p-6 shadow-xl">
        <form th:action="@{/dashboard/serenazgo/personal/{id}/actualizar(id=${sereno.id})}" th:object="${form}" method="post" class="space-y-6">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                <div>
                    <label class="block text-slate-300 font-semibold mb-1">Oficina / Unidad Orgánica</label>
                    <select th:field="*{oficinaId}"
                            class="w-full bg-slate-900 border border-theme rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-indigo-500">
                        <option value="">-- Sin Oficina Específica --</option>
                        <option th:each="o : ${oficinas}" th:value="${o.id}" th:text="${o.nombre}">
                            Subgerencia de Seguridad Ciudadana
                        </option>
                    </select>
                </div>

                <div>
                    <label class="block text-slate-300 font-semibold mb-1">Modalidad / Documento Laboral</label>
                    <input type="text" th:field="*{tipoDocumentoLaboral}"
                           class="w-full bg-slate-900 border border-theme rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-slate-300 font-semibold mb-1">Fecha de Ingreso</label>
                    <input type="date" th:field="*{fechaIngreso}"
                           class="w-full bg-slate-900 border border-theme rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-slate-300 font-semibold mb-1">Fecha de Cese / Salida</label>
                    <input type="date" th:field="*{fechaSalida}"
                           class="w-full bg-slate-900 border border-theme rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-indigo-500">
                    <p class="text-[10px] text-slate-400 mt-1">Dejar en blanco si el efectivo se encuentra en servicio activo.</p>
                </div>
            </div>

            <div>
                <label class="block text-slate-300 font-semibold text-xs mb-1">Observaciones</label>
                <textarea th:field="*{observaciones}" rows="4"
                          class="w-full bg-slate-900 border border-theme rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500"></textarea>
            </div>

            <!-- Botones -->
            <div class="border-t border-theme/60 pt-5 flex items-center justify-end space-x-3 text-xs">
                <a th:href="@{/dashboard/serenazgo/personal/{id}(id=${sereno.id})}"
                   class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold transition-colors">
                    Cancelar
                </a>
                <button type="submit"
                        class="px-5 py-2.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-semibold shadow-lg shadow-amber-600/30 transition-all flex items-center space-x-2">
                    <i data-lucide="check" class="w-4 h-4"></i>
                    <span>Guardar Cambios</span>
                </button>
            </div>
        </form>
    </div>

</div>
</body>
</html>
