<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{admin/admin-layout}">
<head>
    <title>Editar Equipamiento | SIGM-QUINUA</title>
</head>
<body>
<div layout:fragment="content" class="space-y-6">

    <!-- Encabezado Institucional -->
    <div class="border-b border-theme pb-5">
        <div class="flex items-center space-x-2 text-xs text-slate-400 mb-1">
            <span>Seguridad Ciudadana</span>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-500"></i>
            <a th:href="@{/dashboard/serenazgo/equipamiento}" class="hover:text-indigo-400">Equipamiento</a>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-500"></i>
            <span class="text-indigo-400 font-semibold" th:text="${codigoInterno}">EQP-000001</span>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-500"></i>
            <span class="text-slate-300">Editar</span>
        </div>
        <h1 class="text-xl md:text-2xl font-bold text-white tracking-tight flex items-center space-x-2.5">
            <i data-lucide="edit-3" class="w-6 h-6 text-indigo-400"></i>
            <span>Editar Equipamiento <span class="text-indigo-400 font-mono" th:text="${codigoInterno}">EQP-000001</span></span>
        </h1>
        <p class="text-xs md:text-sm text-slate-400 mt-1">
            Actualización de datos técnicos y asignación patrimonial.
        </p>
    </div>

    <!-- Alertas Flash -->
    <div th:if="${error}" class="p-4 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs flex items-center space-x-3">
        <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0"></i>
        <span th:text="${error}">Error en el formulario</span>
    </div>

    <!-- Formulario de Edición -->
    <div class="bg-card border border-theme rounded-xl p-6 shadow-sm max-w-3xl">
        <form th:action="@{/dashboard/serenazgo/equipamiento/{id}/editar(id=${equipoId})}" th:object="${request}" method="POST" class="space-y-6">
            
            <div class="border-b border-theme pb-3">
                <h3 class="text-sm font-bold text-white flex items-center space-x-2">
                    <i data-lucide="package" class="w-4 h-4 text-indigo-400"></i>
                    <span>1. Especificaciones del Bien</span>
                </h3>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Descripción / Denominación Oficial <span class="text-rose-400">*</span></label>
                <input type="text" th:field="*{descripcion}" required
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500"/>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Marca</label>
                    <input type="text" th:field="*{marca}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500"/>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Modelo</label>
                    <input type="text" th:field="*{modelo}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500"/>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Número de Serie</label>
                    <input type="text" th:field="*{numeroSerie}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500"/>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Código Patrimonial</label>
                    <input type="text" th:field="*{codigoPatrimonial}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500"/>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Base / Oficina Responsable</label>
                    <select th:field="*{oficinaResponsableId}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
                        <option value="">-- Base Central de Serenazgo --</option>
                        <option th:each="of : ${oficinas}" th:value="${of.id}" th:text="${of.nombre}"></option>
                    </select>
                </div>

                <div th:if="${esControladoPorCantidad}">
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Stock Total Registrado</label>
                    <input type="number" min="1" th:field="*{stockTotal}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500"/>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Observaciones</label>
                <textarea th:field="*{observaciones}" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500"></textarea>
            </div>

            <div class="flex items-center justify-end space-x-3 pt-4 border-t border-theme">
                <a th:href="@{/dashboard/serenazgo/equipamiento/{id}(id=${equipoId})}"
                   class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors">
                    Cancelar
                </a>
                <button type="submit"
                        class="px-5 py-2 rounded-xl text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/30 transition-all flex items-center space-x-2">
                    <i data-lucide="check" class="w-4 h-4"></i>
                    <span>Guardar Cambios</span>
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
