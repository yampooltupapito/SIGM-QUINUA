<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{admin/admin-layout}">
<head>
    <title>Nueva Caja Municipal — SIGM-QUINUA</title>
</head>
<body>
<div layout:fragment="content" class="space-y-6">

    <div class="flex items-center justify-between">
        <div>
            <div class="flex items-center space-x-2 text-xs text-slate-400 mb-1">
                <a th:href="@{/dashboard/tributaria/cajas}" class="hover:text-blue-400 transition-colors">Cajas Municipales</a>
                <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                <span class="text-slate-200">Nueva Caja</span>
            </div>
            <h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight flex items-center gap-2">
                <i data-lucide="store" class="w-6 h-6 text-blue-400"></i>
                Registro de Punto de Cobranza / Caja Municipal
            </h1>
        </div>
        <a th:href="@{/dashboard/tributaria/cajas}" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium rounded-lg border border-slate-700 transition-colors flex items-center gap-1.5">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span>Volver</span>
        </a>
    </div>

    <div class="max-w-2xl bg-[#202c3d] border border-[#334155] rounded-xl p-6 shadow-sm">
        <form th:action="@{/dashboard/tributaria/cajas}" method="post" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Código Institucional *</label>
                    <input type="text" name="codigo" required placeholder="Ej: CAJA-02"
                           class="w-full bg-[#101827] border border-[#334155] rounded-lg px-3 py-2 text-xs font-mono font-bold text-blue-400 focus:ring-1 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Nombre o Denominación *</label>
                    <input type="text" name="nombre" required placeholder="Ej: Ventanilla Secundaria 2"
                           class="w-full bg-[#101827] border border-[#334155] rounded-lg px-3 py-2 text-xs text-white focus:ring-1 focus:ring-blue-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Ubicación Física</label>
                <input type="text" name="ubicacion" placeholder="Ej: Palacio Municipal - Jr. 28 de Julio S/N, Quinua"
                       class="w-full bg-[#101827] border border-[#334155] rounded-lg px-3 py-2 text-xs text-white focus:ring-1 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Cajero Asignado por Defecto</label>
                <select name="cajeroAsignadoId" class="w-full bg-[#101827] border border-[#334155] rounded-lg px-3 py-2 text-xs text-white focus:ring-1 focus:ring-blue-500">
                    <option value="">-- Sin asignar (Libre para cualquier cajero autorizado) --</option>
                    <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.nombreCompleto} + ' (' + ${u.username} + ')'"></option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Observaciones</label>
                <textarea name="observaciones" rows="3" placeholder="Detalles de equipamiento, POS o ventanilla..."
                          class="w-full bg-[#101827] border border-[#334155] rounded-lg p-2.5 text-xs text-white placeholder-slate-500 focus:ring-1 focus:ring-blue-500"></textarea>
            </div>

            <div class="flex justify-end gap-2 pt-4 border-t border-[#334155]">
                <a th:href="@{/dashboard/tributaria/cajas}" class="px-4 py-2 bg-slate-800 text-slate-300 text-xs rounded-lg hover:bg-slate-700">
                    Cancelar
                </a>
                <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-lg transition-colors">
                    Guardar Caja Municipal
                </button>
            </div>
        </form>
    </div>

</div>
</body>
</html>
