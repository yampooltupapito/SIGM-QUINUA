<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{admin/admin-layout}">
<head>
    <title>Programar Inspección | SIGM-QUINUA</title>
</head>
<body>
<div layout:fragment="content" class="space-y-6 max-w-4xl mx-auto">

    <!-- Encabezado con breadcrumbs -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-[#1e293b] p-6 rounded-2xl border border-[#202c3d] shadow-lg">
        <div>
            <div class="flex items-center gap-2 text-xs text-slate-400 mb-1">
                <a th:href="@{/dashboard}" class="hover:text-blue-400 transition-colors">SIGM-QUINUA</a>
                <span>/</span>
                <a th:href="@{/dashboard/mercados}" class="hover:text-blue-400 transition-colors">Mercados</a>
                <span>/</span>
                <a th:href="@{/dashboard/mercados/inspecciones}" class="hover:text-blue-400 transition-colors">Inspecciones</a>
                <span>/</span>
                <span class="text-slate-200">Programar</span>
            </div>
            <h1 class="text-xl font-bold text-white tracking-tight flex items-center gap-2">
                <svg class="w-6 h-6 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                Programación de Inspección de Mercados
            </h1>
            <p class="text-xs text-slate-400 mt-0.5">Definir los parámetros de supervisión, plantilla aplicable, alcance y fecha de visita.</p>
        </div>

        <a th:href="@{/dashboard/mercados/inspecciones}"
           class="inline-flex items-center gap-2 px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white text-xs font-semibold rounded-xl shadow-lg transition-colors">
            Volver a la Bandeja
        </a>
    </div>

    <!-- Formulario de Creación / Programación -->
    <div class="bg-[#1e293b] p-6 rounded-2xl border border-[#202c3d] shadow-lg">
        <form id="formProgramarInspeccion" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Mercado Municipal -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Mercado Municipal <span class="text-rose-500">*</span></label>
                    <select id="mercadoId" required class="w-full bg-[#101827] border border-[#334155] text-slate-200 text-xs rounded-xl px-3 py-2.5 focus:ring-1 focus:ring-indigo-500">
                        <option value="">-- Seleccione Mercado --</option>
                        <option th:each="m : ${mercados}" th:value="${m.id}" th:text="${m.nombre}"></option>
                    </select>
                </div>

                <!-- Tipo de Inspección -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Tipo de Inspección <span class="text-rose-500">*</span></label>
                    <select id="tipoInspeccion" required class="w-full bg-[#101827] border border-[#334155] text-slate-200 text-xs rounded-xl px-3 py-2.5 focus:ring-1 focus:ring-indigo-500">
                        <option th:each="t : ${tiposInspeccion}" th:value="${t}" th:text="${t.descripcion}"></option>
                    </select>
                </div>
            </div>

            <!-- Plantilla de Verificación -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Plantilla / Lista de Verificación</label>
                <select id="plantillaId" class="w-full bg-[#101827] border border-[#334155] text-slate-200 text-xs rounded-xl px-3 py-2.5 focus:ring-1 focus:ring-indigo-500">
                    <option value="">-- Sin plantilla predefinida --</option>
                    <option th:each="p : ${plantillas}" th:value="${p.id}" th:text="${p.codigo + ' - ' + p.nombre}"></option>
                </select>
                <p class="text-[11px] text-slate-400 mt-1">Permite asociar una lista de chequeo con ítems predeterminados para la inspección.</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Fecha Programada -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Fecha Programada <span class="text-rose-500">*</span></label>
                    <input type="date" id="fechaProgramada" required
                           class="w-full bg-[#101827] border border-[#334155] text-slate-200 text-xs rounded-xl px-3 py-2.5 focus:ring-1 focus:ring-indigo-500"/>
                </div>

                <!-- Hora Programada -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Hora Programada (Opcional)</label>
                    <input type="time" id="horaProgramada"
                           class="w-full bg-[#101827] border border-[#334155] text-slate-200 text-xs rounded-xl px-3 py-2.5 focus:ring-1 focus:ring-indigo-500"/>
                </div>
            </div>

            <!-- Motivo de la Inspección -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Motivo de la Supervisión <span class="text-rose-500">*</span></label>
                <input type="text" id="motivo" required placeholder="Ej. Campaña periódica de salubridad y orden comercial"
                       class="w-full bg-[#101827] border border-[#334155] text-slate-200 text-xs rounded-xl px-3 py-2.5 focus:ring-1 focus:ring-indigo-500"/>
            </div>

            <!-- Objetivo -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Objetivo Técnico de la Visita <span class="text-rose-500">*</span></label>
                <textarea id="objetivo" required rows="3" placeholder="Detalle los aspectos clave a supervisar y alcances esperados..."
                          class="w-full bg-[#101827] border border-[#334155] text-slate-200 text-xs rounded-xl px-3 py-2.5 focus:ring-1 focus:ring-indigo-500"></textarea>
            </div>

            <!-- Observaciones Generales -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Observaciones / Instrucciones Preliminares</label>
                <textarea id="observacionesGenerales" rows="2" placeholder="Indicaciones para el equipo de inspección..."
                          class="w-full bg-[#101827] border border-[#334155] text-slate-200 text-xs rounded-xl px-3 py-2.5 focus:ring-1 focus:ring-indigo-500"></textarea>
            </div>

            <!-- Botones -->
            <div class="flex justify-end gap-3 pt-4 border-t border-[#334155]">
                <a th:href="@{/dashboard/mercados/inspecciones}" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl transition-colors">
                    Cancelar
                </a>
                <button type="submit" id="btnGuardar" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-xl shadow-lg transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                    Confirmar Programación
                </button>
            </div>
        </form>
    </div>

</div>

<th:block layout:fragment="scripts">
<script>
document.addEventListener("DOMContentLoaded", function() {
    const form = document.getElementById("formProgramarInspeccion");
    const hoy = new Date().toISOString().split("T")[0];
    document.getElementById("fechaProgramada").value = hoy;

    form.addEventListener("submit", async function(e) {
        e.preventDefault();

        const payload = {
            mercadoId: document.getElementById("mercadoId").value,
            tipoInspeccion: document.getElementById("tipoInspeccion").value,
            plantillaId: document.getElementById("plantillaId").value || null,
            fechaProgramada: document.getElementById("fechaProgramada").value,
            horaProgramada: document.getElementById("horaProgramada").value || null,
            motivo: document.getElementById("motivo").value.trim(),
            objetivo: document.getElementById("objetivo").value.trim(),
            observacionesGenerales: document.getElementById("observacionesGenerales").value.trim() || null
        };

        const btn = document.getElementById("btnGuardar");
        btn.disabled = true;
        btn.innerHTML = "Guardando...";

        try {
            const resp = await fetchApi("/api/mercados/inspecciones", {
                method: "POST",
                body: JSON.stringify(payload)
            });
            mostrarToast("Inspección programada con éxito: " + resp.codigoInspeccion, "success");
            setTimeout(() => {
                window.location.href = "/dashboard/mercados/inspecciones/" + resp.id;
            }, 800);
        } catch (err) {
            btn.disabled = false;
            btn.innerHTML = "Confirmar Programación";
        }
    });
});
</script>
</th:block>
</body>
</html>
