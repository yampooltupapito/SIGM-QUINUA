<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<div id="modalObservacion" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-[#1e293b] w-full max-w-lg rounded-2xl border border-[#334155] shadow-2xl overflow-hidden flex flex-col">
        <div class="px-6 py-4 bg-[#101827] border-b border-[#334155] flex items-center justify-between">
            <h3 class="text-sm font-bold text-white flex items-center gap-2">
                <svg class="w-5 h-5 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                Formular Observación Administrativa
            </h3>
            <button type="button" onclick="cerrarModal('modalObservacion')" class="text-slate-400 hover:text-white">&times;</button>
        </div>

        <form id="formObservacion" class="p-6 space-y-4">
            <p class="text-xs text-slate-300">
                La solicitud pasará al estado <span class="text-orange-400 font-bold">OBSERVADA</span>. El administrado deberá subsanar los requisitos señalados en el plazo de ley.
            </p>

            <div>
                <label for="obsDetalle" class="block text-xs font-medium text-slate-300 mb-1">Detalle de la Observación o Requisito Faltante *</label>
                <textarea id="obsDetalle" name="detalleObservacion" rows="4" required
                          placeholder="Indique con claridad los documentos o requisitos que el administrado debe subsanar..."
                          class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-orange-500"></textarea>
            </div>

            <div class="flex items-center justify-end gap-2 pt-3 border-t border-[#334155]">
                <button type="button" onclick="cerrarModal('modalObservacion')"
                        class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl border border-[#334155]">
                    Cancelar
                </button>
                <button type="submit"
                        class="px-4 py-2 bg-orange-600 hover:bg-orange-700 text-white text-xs font-semibold rounded-xl shadow-lg">
                    Notificar Observación
                </button>
            </div>
        </form>
    </div>
</div>
</html>
