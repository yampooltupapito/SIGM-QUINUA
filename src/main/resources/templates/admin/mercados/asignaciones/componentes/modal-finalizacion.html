<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<div id="modalFinalizacion" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-[#1e293b] w-full max-w-lg rounded-2xl border border-[#334155] shadow-2xl overflow-hidden flex flex-col">
        <div class="px-6 py-4 bg-[#101827] border-b border-[#334155] flex items-center justify-between">
            <h3 class="text-sm font-bold text-white flex items-center gap-2">
                <svg class="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                Finalización de Asignación de Puesto
            </h3>
            <button type="button" onclick="cerrarModal('modalFinalizacion')" class="text-slate-400 hover:text-white">&times;</button>
        </div>

        <form id="formFinalizacion" class="p-6 space-y-4">
            <p class="text-xs text-slate-300">
                La asignación pasará al estado <span class="text-zinc-300 font-bold">FINALIZADA</span>. Se registrará la fecha efectiva de culminación en el padrón histórico.
            </p>

            <div>
                <label for="finMotivo" class="block text-xs font-medium text-slate-300 mb-1">Motivo de Culminación o Cierre *</label>
                <textarea id="finMotivo" name="motivoFinalizacion" rows="3" required
                          placeholder="Vencimiento de vigencia, renuncia voluntaria, resolución de contrato..."
                          class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-zinc-500"></textarea>
            </div>

            <div>
                <label for="finFecha" class="block text-xs font-medium text-slate-300 mb-1">Fecha Efectiva de Culminación</label>
                <input type="date" id="finFecha" name="fechaEfectivaCierre"
                       class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-zinc-500">
            </div>

            <div class="flex items-center gap-2 pt-2">
                <input type="checkbox" id="chkDevolucionInmediata" name="registrarDevolucionInmediata" value="true"
                       class="w-4 h-4 rounded bg-[#101827] border-[#334155] text-zinc-600 focus:ring-0">
                <label for="chkDevolucionInmediata" class="text-xs text-slate-300">
                    Registrar entrega física y devolución del puesto simultáneamente.
                </label>
            </div>

            <div id="seccionDevolucionExtra" class="hidden space-y-3 pt-2 border-t border-[#334155]">
                <div>
                    <label for="devEstadoFisicoFin" class="block text-xs font-medium text-slate-300 mb-1">Estado Físico del Puesto</label>
                    <select id="devEstadoFisicoFin" name="estadoFisicoPuesto"
                            class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-xs text-slate-200">
                        <option value="BUENO">BUENO — En óptimas condiciones</option>
                        <option value="REGULAR">REGULAR — Desgaste por uso normal</option>
                        <option value="MALO">MALO — Daños o deterioros evidentes</option>
                        <option value="REQUIERE_MANTENIMIENTO">REQUIERE_MANTENIMIENTO — Requiere obras o refacción</option>
                    </select>
                </div>
            </div>

            <div class="flex items-center justify-end gap-2 pt-3 border-t border-[#334155]">
                <button type="button" onclick="cerrarModal('modalFinalizacion')"
                        class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl border border-[#334155]">
                    Cancelar
                </button>
                <button type="submit"
                        class="px-4 py-2 bg-zinc-700 hover:bg-zinc-600 text-white text-xs font-semibold rounded-xl shadow-lg">
                    Finalizar Asignación
                </button>
            </div>
        </form>
    </div>
</div>
</html>
