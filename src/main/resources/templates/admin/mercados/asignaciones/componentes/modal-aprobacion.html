<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<div id="modalAprobacion" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-[#1e293b] w-full max-w-lg rounded-2xl border border-[#334155] shadow-2xl overflow-hidden flex flex-col">
        <div class="px-6 py-4 bg-[#101827] border-b border-[#334155] flex items-center justify-between">
            <h3 class="text-sm font-bold text-white flex items-center gap-2">
                <svg class="w-5 h-5 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                Aprobación de Asignación de Puesto
            </h3>
            <button type="button" onclick="cerrarModal('modalAprobacion')" class="text-slate-400 hover:text-white">&times;</button>
        </div>

        <form id="formAprobacion" class="p-6 space-y-4">
            <p class="text-xs text-slate-300">
                La solicitud pasará al estado <span class="text-teal-400 font-bold">APROBADA</span> mediante acto resolutivo o disposición administrativa competente.
            </p>

            <div>
                <label for="aprobSustento" class="block text-xs font-medium text-slate-300 mb-1">Sustento Resolutivo / N° de Resolución *</label>
                <textarea id="aprobSustento" name="sustentoAprobacion" rows="3" required
                          placeholder="Ejemplo: Resolución de Gerencia Municipal N° 045-2026-MDQ/GM..."
                          class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-teal-500"></textarea>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label for="aprobFechaInicio" class="block text-xs font-medium text-slate-300 mb-1">Inicio de Vigencia</label>
                    <input type="date" id="aprobFechaInicio" name="fechaInicioVigencia"
                           class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-teal-500">
                </div>
                <div>
                    <label for="aprobFechaFin" class="block text-xs font-medium text-slate-300 mb-1">Fin de Vigencia (Opcional)</label>
                    <input type="date" id="aprobFechaFin" name="fechaFinVigencia"
                           class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-teal-500">
                </div>
            </div>

            <div class="flex items-center gap-2 pt-2">
                <input type="checkbox" id="activarInmediatamente" name="activarInmediatamente" value="true"
                       class="w-4 h-4 rounded bg-[#101827] border-[#334155] text-teal-600 focus:ring-0">
                <label for="activarInmediatamente" class="text-xs text-slate-300">
                    Activar ocupación inmediata del puesto (pasar directamente a estado VIGENTE).
                </label>
            </div>

            <div class="flex items-center justify-end gap-2 pt-3 border-t border-[#334155]">
                <button type="button" onclick="cerrarModal('modalAprobacion')"
                        class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl border border-[#334155]">
                    Cancelar
                </button>
                <button type="submit"
                        class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white text-xs font-semibold rounded-xl shadow-lg">
                    Aprobar Asignación
                </button>
            </div>
        </form>
    </div>
</div>
</html>
