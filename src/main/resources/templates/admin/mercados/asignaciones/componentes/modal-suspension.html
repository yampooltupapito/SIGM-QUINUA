<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<div id="modalSuspension" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-[#1e293b] w-full max-w-lg rounded-2xl border border-[#334155] shadow-2xl overflow-hidden flex flex-col">
        <div class="px-6 py-4 bg-[#101827] border-b border-[#334155] flex items-center justify-between">
            <h3 class="text-sm font-bold text-white flex items-center gap-2">
                <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                Suspensión Temporal de Asignación
            </h3>
            <button type="button" onclick="cerrarModal('modalSuspension')" class="text-slate-400 hover:text-white">&times;</button>
        </div>

        <form id="formSuspension" class="p-6 space-y-4">
            <p class="text-xs text-slate-300">
                La asignación pasará al estado <span class="text-purple-400 font-bold">SUSPENDIDA</span>. El puesto no quedará disponible para terceros durante el periodo de suspensión cautelar.
            </p>

            <div>
                <label for="suspensionMotivo" class="block text-xs font-medium text-slate-300 mb-1">Causa o Motivo de Suspensión *</label>
                <textarea id="suspensionMotivo" name="motivoSuspension" rows="4" required
                          placeholder="Especifique el procedimiento sancionador, incumplimiento o causa que origina la suspensión..."
                          class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-purple-500"></textarea>
            </div>

            <div class="flex items-center gap-2 pt-2">
                <input type="checkbox" id="mantieneReservaPuesto" name="mantieneReservaPuesto" value="true" checked
                       class="w-4 h-4 rounded bg-[#101827] border-[#334155] text-purple-600 focus:ring-0">
                <label for="mantieneReservaPuesto" class="text-xs text-slate-300">
                    Mantener la reserva física del puesto para el comerciante suspendido.
                </label>
            </div>

            <div class="flex items-center justify-end gap-2 pt-3 border-t border-[#334155]">
                <button type="button" onclick="cerrarModal('modalSuspension')"
                        class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl border border-[#334155]">
                    Cancelar
                </button>
                <button type="submit"
                        class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white text-xs font-semibold rounded-xl shadow-lg">
                    Confirmar Suspensión
                </button>
            </div>
        </form>
    </div>
</div>
</html>
