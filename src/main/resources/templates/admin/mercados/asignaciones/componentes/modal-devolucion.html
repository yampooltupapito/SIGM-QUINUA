<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<div id="modalDevolucion" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-[#1e293b] w-full max-w-lg rounded-2xl border border-[#334155] shadow-2xl overflow-hidden flex flex-col">
        <div class="px-6 py-4 bg-[#101827] border-b border-[#334155] flex items-center justify-between">
            <h3 class="text-sm font-bold text-white flex items-center gap-2">
                <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
                Acta de Entrega Física y Devolución del Puesto
            </h3>
            <button type="button" onclick="cerrarModal('modalDevolucion')" class="text-slate-400 hover:text-white">&times;</button>
        </div>

        <form id="formDevolucion" class="p-6 space-y-4">
            <p class="text-xs text-slate-300">
                Formalice la recepción del espacio público comercial. El puesto cambiará a estado <span class="text-blue-400 font-semibold">DISPONIBLE</span> (o <span class="text-amber-400 font-semibold">MANTENIMIENTO</span> si requiere reparaciones).
            </p>

            <div>
                <label for="devEstadoFisico" class="block text-xs font-medium text-slate-300 mb-1">Estado Físico en la Recepción *</label>
                <select id="devEstadoFisico" name="estadoFisicoPuesto" required
                        class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
                    <option value="BUENO">BUENO — En óptimas condiciones operativas</option>
                    <option value="REGULAR">REGULAR — Desgaste natural admisible</option>
                    <option value="MALO">MALO — Daños que ameritan inspección o cobro de garantías</option>
                    <option value="REQUIERE_MANTENIMIENTO">REQUIERE_MANTENIMIENTO — Requiere refacción previa a reasignación</option>
                </select>
            </div>

            <div>
                <label for="devObservaciones" class="block text-xs font-medium text-slate-300 mb-1">Observaciones o Inventario Físico</label>
                <textarea id="devObservaciones" name="observaciones" rows="3"
                          placeholder="Detalle el estado de medidores, conexiones eléctricas, rejas, piso o llaves entregadas..."
                          class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500"></textarea>
            </div>

            <div class="flex items-center justify-end gap-2 pt-3 border-t border-[#334155]">
                <button type="button" onclick="cerrarModal('modalDevolucion')"
                        class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl border border-[#334155]">
                    Cancelar
                </button>
                <button type="submit"
                        class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-xl shadow-lg">
                    Firmar Recepción y Devolución
                </button>
            </div>
        </form>
    </div>
</div>
</html>
