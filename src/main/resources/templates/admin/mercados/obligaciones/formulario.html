<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/admin-layout}">
<head>
    <title>Nueva Obligación Comercial | SIGM-QUINUA</title>
</head>
<body>
<div layout:fragment="content" class="max-w-4xl mx-auto space-y-6">

    <!-- Encabezado con breadcrumbs -->
    <div class="bg-[#1e293b] p-6 rounded-2xl border border-[#202c3d] shadow-lg">
        <div class="flex items-center gap-2 text-xs text-slate-400 mb-1">
            <a th:href="@{/dashboard}" class="hover:text-blue-400 transition-colors">SIGM-QUINUA</a>
            <span>/</span>
            <a th:href="@{/dashboard/mercados}" class="hover:text-blue-400 transition-colors">Mercados</a>
            <span>/</span>
            <a th:href="@{/dashboard/mercados/obligaciones}" class="hover:text-blue-400 transition-colors">Obligaciones</a>
            <span>/</span>
            <span class="text-slate-200">Nueva</span>
        </div>
        <h1 class="text-xl font-bold text-white tracking-tight flex items-center gap-2">
            <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            Emisión de Obligación Económica Comercial
        </h1>
        <p class="text-xs text-slate-400 mt-0.5">Generación de canon de arrendamiento, merced conductiva o derechos de mercado.</p>
    </div>

    <!-- Formulario de Registro -->
    <div class="bg-[#1e293b] p-6 rounded-2xl border border-[#202c3d] shadow-lg">
        <form id="formNuevaObligacion" class="space-y-6">
            <div id="alertaError" class="hidden p-4 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-semibold"></div>
            <div id="alertaExito" class="hidden p-4 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold"></div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                <!-- Comerciante Titular -->
                <div class="md:col-span-2 space-y-2">
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">Comerciante Titular *</label>
                    <div class="flex gap-2">
                        <input type="text" id="comercianteBusqueda" placeholder="Buscar por DNI, RUC, Código o Nombre de comerciante..."
                               class="flex-1 bg-[#101827] text-white px-3 py-2 rounded-xl border border-[#334155] focus:outline-none focus:border-blue-500">
                        <button type="button" onclick="buscarComercianteObligacion()"
                                class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-xs transition-colors">
                            Buscar Comerciante
                        </button>
                    </div>
                    <input type="hidden" id="comercianteId" th:value="${comercianteId}">
                    <div id="resultadoComerciante" class="text-xs"></div>
                </div>

                <!-- Concepto de Cobro -->
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">Concepto de Cobro *</label>
                    <select id="conceptoId" required onchange="actualizarTarifaSugerida()"
                            class="w-full bg-[#101827] text-white px-3 py-2 rounded-xl border border-[#334155] focus:outline-none focus:border-blue-500">
                        <option value="">Seleccione concepto...</option>
                        <option th:each="c : ${conceptos}" th:value="${c.id}" th:text="${c.nombre} + ' (' + ${c.codigo} + ')'"></option>
                    </select>
                </div>

                <!-- Período Inicio -->
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">Inicio de Período</label>
                    <input type="date" id="periodoInicio"
                           class="w-full bg-[#101827] text-white px-3 py-2 rounded-xl border border-[#334155] focus:outline-none focus:border-blue-500">
                </div>

                <!-- Período Fin -->
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">Fin de Período</label>
                    <input type="date" id="periodoFin"
                           class="w-full bg-[#101827] text-white px-3 py-2 rounded-xl border border-[#334155] focus:outline-none focus:border-blue-500">
                </div>

                <!-- Monto Total -->
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">Monto Total Exigible (S/) *</label>
                    <input type="number" step="0.01" min="0.01" id="montoOriginal" required placeholder="0.00"
                           class="w-full bg-[#101827] text-white font-mono font-bold px-3 py-2 rounded-xl border border-[#334155] focus:outline-none focus:border-blue-500">
                </div>

                <!-- Fecha de Vencimiento -->
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">Fecha de Vencimiento *</label>
                    <input type="date" id="fechaVencimiento" required
                           class="w-full bg-[#101827] text-white px-3 py-2 rounded-xl border border-[#334155] focus:outline-none focus:border-blue-500">
                </div>

                <!-- Número de Cuotas -->
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">Fraccionamiento (N° Cuotas)</label>
                    <select id="numeroCuotas" class="w-full bg-[#101827] text-white px-3 py-2 rounded-xl border border-[#334155] focus:outline-none focus:border-blue-500">
                        <option value="1">1 Cuota (Pago Único)</option>
                        <option value="2">2 Cuotas</option>
                        <option value="3">3 Cuotas</option>
                        <option value="6">6 Cuotas</option>
                        <option value="12">12 Cuotas Mensuales</option>
                    </select>
                </div>

                <!-- Observaciones -->
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">Observaciones / Referencia</label>
                    <input type="text" id="observaciones" placeholder="Sustento o número de expediente..."
                           class="w-full bg-[#101827] text-white px-3 py-2 rounded-xl border border-[#334155] focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <div class="flex justify-end gap-3 pt-4 border-t border-[#334155]/60">
                <a th:href="@{/dashboard/mercados/obligaciones}"
                   class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-semibold transition-colors">
                    Cancelar
                </a>
                <button type="submit"
                        class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-semibold shadow-lg transition-colors">
                    Emitir Obligación
                </button>
            </div>
        </form>
    </div>

    <script>
    async function buscarComercianteObligacion() {
        const q = document.getElementById('comercianteBusqueda')?.value.trim();
        const resDiv = document.getElementById('resultadoComerciante');
        if (!q) {
            alert('Ingrese un número de documento, código o nombre.');
            return;
        }
        resDiv.innerHTML = '<span class="text-slate-400">Buscando...</span>';
        try {
            const resp = await fetch(`/api/mercados/comerciantes?termino=${encodeURIComponent(q)}&size=5`);
            if (!resp.ok) throw new Error('Error al buscar comerciante');
            const data = await resp.json();
            const lista = data.content || [];
            if (lista.length === 0) {
                resDiv.innerHTML = '<span class="text-rose-400 font-semibold">No se encontró ningún comerciante con esos datos.</span>';
                document.getElementById('comercianteId').value = '';
                return;
            }
            const c = lista[0];
            document.getElementById('comercianteId').value = c.id;
            const nombre = c.titularNombre || `${c.personaNombres || ''} ${c.personaApellidoPaterno || ''}`.trim() || 'Comerciante Titular';
            const doc = c.documentoCompleto || c.documentoEnmascarado || c.personaNumeroDocumento || '-';
            resDiv.innerHTML = `
                <div class="p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-between">
                    <div>
                        <span class="font-bold text-white text-xs block">${nombre}</span>
                        <span class="text-slate-400 text-[10px]">Documento: ${doc} | Código: ${c.codigoComerciante || '-'}</span>
                    </div>
                    <span class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                        COMERCIANTE SELECCIONADO
                    </span>
                </div>
            `;
        } catch (e) {
            resDiv.innerHTML = `<span class="text-rose-400 font-semibold">${e.message}</span>`;
        }
    }

    async function actualizarTarifaSugerida() {
        const conceptoId = document.getElementById('conceptoId').value;
        if (!conceptoId) return;

        try {
            const resp = await fetch(`/api/mercados/tarifas/aplicable?conceptoId=${conceptoId}`);
            if (resp.ok) {
                const tarifa = await resp.json();
                if (tarifa && tarifa.monto) {
                    document.getElementById('montoOriginal').value = Number(tarifa.monto).toFixed(2);
                }
            }
        } catch (e) {
            console.warn('No se pudo autocompletar tarifa', e);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const cId = document.getElementById('comercianteId')?.value;
        if (cId) {
            fetch(`/api/mercados/comerciantes/${cId}`)
                .then(r => r.json())
                .then(c => {
                    const nombre = c.titularNombre || `${c.personaNombres || ''} ${c.personaApellidoPaterno || ''}`.trim() || cId;
                    const doc = c.documentoCompleto || c.documentoEnmascarado || '';
                    document.getElementById('resultadoComerciante').innerHTML = `
                        <div class="p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400">
                            <span class="font-bold text-white text-xs block">${nombre}</span>
                            <span class="text-slate-400 text-[10px]">Doc: ${doc} | ID: ${cId}</span>
                        </div>
                    `;
                })
                .catch(() => {
                    document.getElementById('resultadoComerciante').innerText = 'Comerciante preseleccionado con ID: ' + cId;
                });
        }

        document.getElementById('comercianteBusqueda')?.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                buscarComercianteObligacion();
            }
        });

        const form = document.getElementById('formNuevaObligacion');
        if (form) {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const errDiv = document.getElementById('alertaError');
                const okDiv = document.getElementById('alertaExito');
                errDiv.classList.add('hidden');
                okDiv.classList.add('hidden');

                const comercianteId = document.getElementById('comercianteId').value;
                if (!comercianteId) {
                    errDiv.innerText = 'Debe buscar y seleccionar un comerciante titular.';
                    errDiv.classList.remove('hidden');
                    return;
                }

                const payload = {
                    comercianteId: comercianteId,
                    conceptoId: document.getElementById('conceptoId').value,
                    periodoInicio: document.getElementById('periodoInicio').value || null,
                    periodoFin: document.getElementById('periodoFin').value || null,
                    montoOriginal: parseFloat(document.getElementById('montoOriginal').value),
                    fechaVencimiento: document.getElementById('fechaVencimiento').value,
                    numeroCuotas: parseInt(document.getElementById('numeroCuotas').value),
                    observaciones: document.getElementById('observaciones').value
                };

                try {
                    const resp = await fetch('/api/mercados/obligaciones', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!resp.ok) {
                        const errData = await resp.json().catch(() => ({}));
                        throw new Error(errData.message || 'Error al emitir la obligación.');
                    }

                    const data = await resp.json();
                    okDiv.innerText = '¡Obligación ' + data.codigoObligacion + ' emitida exitosamente!';
                    okDiv.classList.remove('hidden');
                    setTimeout(() => {
                        window.location.href = '/dashboard/mercados/obligaciones/' + data.id;
                    }, 1200);
                } catch (err) {
                    errDiv.innerText = err.message;
                    errDiv.classList.remove('hidden');
                }
            });
        }
    });

    window.buscarComercianteObligacion = buscarComercianteObligacion;
    window.actualizarTarifaSugerida = actualizarTarifaSugerida;
    </script>
</div>

<th:block layout:fragment="scripts">
</th:block>
</body>
</html>
