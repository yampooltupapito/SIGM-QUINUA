<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="filtrosPuestos" class="bg-[#1e293b] p-4 rounded-xl border border-[#202c3d] mb-6 shadow-md">
    <form method="get" th:action="@{/dashboard/mercados/{id}/puestos(id=${mercado.id})}" class="space-y-4">
        <input type="hidden" name="vista" th:value="${vista}" />
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-3">
            <!-- Búsqueda textual -->
            <div class="lg:col-span-2">
                <label class="block text-xs font-semibold text-slate-400 mb-1">Buscar por Código, N° o Ubicación</label>
                <div class="relative">
                    <input type="text" name="termino" th:value="${termino}" placeholder="Ej. P-101, Central, Frutas..."
                           class="w-full bg-[#101827] border border-[#334155] rounded-lg px-3 py-2 text-sm text-[#e2e8f0] focus:outline-none focus:border-blue-500 transition-colors" />
                </div>
            </div>

            <!-- Filtro por Sector -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Sector Comercial</label>
                <select name="sectorId" class="w-full bg-[#101827] border border-[#334155] rounded-lg px-3 py-2 text-sm text-[#e2e8f0] focus:outline-none focus:border-blue-500">
                    <option value="">Todos los sectores</option>
                    <option th:each="s : ${sectores}" th:value="${s.id}" th:text="${s.codigo + ' - ' + s.nombre}"
                            th:selected="${sectorIdSeleccionado != null && sectorIdSeleccionado == s.id}"></option>
                </select>
            </div>

            <!-- Filtro por Tipo de Puesto -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Tipo de Puesto</label>
                <select name="tipoPuestoId" class="w-full bg-[#101827] border border-[#334155] rounded-lg px-3 py-2 text-sm text-[#e2e8f0] focus:outline-none focus:border-blue-500">
                    <option value="">Todos los tipos</option>
                    <option th:each="t : ${tiposPuesto}" th:value="${t.id}" th:text="${t.nombre}"
                            th:selected="${tipoPuestoIdSeleccionado != null && tipoPuestoIdSeleccionado == t.id}"></option>
                </select>
            </div>

            <!-- Filtro por Estado Físico -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Estado Físico</label>
                <select name="estadoFisico" class="w-full bg-[#101827] border border-[#334155] rounded-lg px-3 py-2 text-sm text-[#e2e8f0] focus:outline-none focus:border-blue-500">
                    <option value="">Todos</option>
                    <option th:each="ef : ${estadosFisicos}" th:value="${ef}" th:text="${ef.descripcion}"
                            th:selected="${estadoFisicoSeleccionado != null && estadoFisicoSeleccionado == ef}"></option>
                </select>
            </div>
        </div>

        <div class="flex items-center justify-between pt-2 border-t border-[#202c3d]">
            <div class="flex items-center space-x-2">
                <a th:href="@{/dashboard/mercados/{id}/puestos(id=${mercado.id})}"
                   class="text-xs text-slate-400 hover:text-slate-200 transition-colors flex items-center gap-1">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    Limpiar filtros
                </a>
            </div>
            <div class="flex items-center space-x-2">
                <button type="submit"
                        class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-semibold shadow-sm transition-colors flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    Aplicar Filtros
                </button>
            </div>
        </div>
    </form>
</div>
</body>
</html>
