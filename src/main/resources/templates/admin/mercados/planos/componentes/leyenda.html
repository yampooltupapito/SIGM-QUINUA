<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body>
<div th:fragment="leyendaPlanos" class="flex flex-wrap items-center gap-3 bg-[#1e293b]/90 backdrop-blur px-4 py-2.5 rounded-xl border border-[#334155] shadow-lg text-xs">
    <span class="text-slate-400 font-medium flex items-center gap-1.5 pr-2 border-r border-slate-700">
        <svg class="w-3.5 h-3.5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>Leyenda:</span>
    </span>

    <button type="button" data-filtro-estado="TODOS" onclick="filtrarPorEstado('TODOS')"
            class="filtro-btn px-2.5 py-1 rounded-lg text-slate-300 hover:text-white bg-slate-800 border border-slate-600 transition-colors flex items-center gap-1.5 active-filter">
        <span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
        <span>Todos</span>
        <span class="text-[10px] text-slate-400 font-bold" th:text="'(' + (${estadisticas != null ? estadisticas.totalPuestos : 0}) + ')'">(0)</span>
    </button>

    <button type="button" data-filtro-estado="DISPONIBLE" onclick="filtrarPorEstado('DISPONIBLE')"
            class="filtro-btn px-2.5 py-1 rounded-lg text-slate-300 hover:text-white hover:bg-emerald-950/60 border border-emerald-600/40 transition-colors flex items-center gap-1.5">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-sm shadow-emerald-500/50"></span>
        <span>Disponibles</span>
        <span class="text-[10px] text-emerald-400 font-bold" th:text="'(' + (${estadisticas != null ? estadisticas.puestosDisponibles : 0}) + ')'">(0)</span>
    </button>

    <button type="button" data-filtro-estado="OCUPADO" onclick="filtrarPorEstado('OCUPADO')"
            class="filtro-btn px-2.5 py-1 rounded-lg text-slate-300 hover:text-white hover:bg-blue-950/60 border border-blue-600/40 transition-colors flex items-center gap-1.5">
        <span class="w-2.5 h-2.5 rounded-full bg-blue-500 shadow-sm shadow-blue-500/50"></span>
        <span>Ocupados</span>
        <span class="text-[10px] text-blue-400 font-bold" th:text="'(' + (${estadisticas != null ? estadisticas.puestosOcupados : 0}) + ')'">(0)</span>
    </button>

    <button type="button" data-filtro-estado="RESERVADO" onclick="filtrarPorEstado('RESERVADO')"
            class="filtro-btn px-2.5 py-1 rounded-lg text-slate-300 hover:text-white hover:bg-amber-950/60 border border-amber-600/40 transition-colors flex items-center gap-1.5">
        <span class="w-2.5 h-2.5 rounded-full bg-amber-500 shadow-sm shadow-amber-500/50"></span>
        <span>Reservados</span>
        <span class="text-[10px] text-amber-400 font-bold" th:text="'(' + (${estadisticas != null ? estadisticas.puestosReservados : 0}) + ')'">(0)</span>
    </button>

    <button type="button" data-filtro-estado="INACTIVO" onclick="filtrarPorEstado('INACTIVO')"
            class="filtro-btn px-2.5 py-1 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/80 border border-slate-600/40 transition-colors flex items-center gap-1.5">
        <span class="w-2.5 h-2.5 rounded-full bg-slate-500"></span>
        <span>Mantenimiento</span>
        <span class="text-[10px] text-slate-400 font-bold" th:text="'(' + (${estadisticas != null ? estadisticas.puestosInactivos : 0}) + ')'">(0)</span>
    </button>

    <button type="button" data-filtro-estado="RESTRINGIDO" onclick="filtrarPorEstado('RESTRINGIDO')"
            class="filtro-btn px-2.5 py-1 rounded-lg text-slate-300 hover:text-white hover:bg-rose-950/60 border border-rose-600/40 transition-colors flex items-center gap-1.5">
        <span class="w-2.5 h-2.5 rounded-full bg-rose-500 shadow-sm shadow-rose-500/50"></span>
        <span>Restringidos</span>
        <span class="text-[10px] text-rose-400 font-bold" th:text="'(' + (${estadisticas != null ? estadisticas.puestosRestringidos : 0}) + ')'">(0)</span>
    </button>
</div>
</body>
</html>
