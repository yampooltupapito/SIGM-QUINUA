<!-- Modal Institucional para Cambio de Estado de Comerciante -->
<div id="modalEstadoComerciante" class="fixed inset-0 z-50 hidden overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
        <!-- Overlay -->
        <div class="fixed inset-0 bg-black/75 transition-opacity" aria-hidden="true" onclick="cerrarModalEstado()"></div>

        <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

        <!-- Panel del Modal -->
        <div class="inline-block align-bottom bg-[#1e293b] rounded-2xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full border border-[#334155]">
            <form id="formCambiarEstadoComerciante" onsubmit="enviarCambioEstado(event)">
                <input type="hidden" id="modalComercianteId" name="comercianteId">

                <div class="bg-[#1e293b] px-6 pt-6 pb-4">
                    <div class="flex items-center justify-between pb-4 border-b border-[#334155]">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-amber-500/10 flex items-center justify-center text-amber-500">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                            </div>
                            <div>
                                <h3 class="text-base font-bold text-white tracking-tight" id="modal-title">Cambiar Estado de Comerciante</h3>
                                <p class="text-xs text-slate-400" id="modalComercianteNombre">Actualización formal en el padrón municipal</p>
                            </div>
                        </div>
                        <button type="button" onclick="cerrarModalEstado()" class="text-slate-400 hover:text-white p-1 rounded-lg">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>
                    </div>

                    <div class="mt-4 space-y-4 text-xs text-slate-300">
                        <div>
                            <label for="modalNuevoEstado" class="block font-semibold text-slate-200 mb-1">Nuevo Estado <span class="text-red-400">*</span></label>
                            <select id="modalNuevoEstado" name="nuevoEstado" required class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-white text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
                                <option value="">Seleccione el nuevo estado...</option>
                                <option value="PENDIENTE_VERIFICACION">Pendiente de Verificación</option>
                                <option value="ACTIVO">Activo</option>
                                <option value="SUSPENDIDO">Suspendido</option>
                                <option value="INACTIVO">Inactivo</option>
                            </select>
                        </div>

                        <div>
                            <label for="modalMotivo" class="block font-semibold text-slate-200 mb-1">Motivo Justificatorio <span class="text-red-400">* (5 a 500 caracteres)</span></label>
                            <textarea id="modalMotivo" name="motivo" rows="3" required minlength="5" maxlength="500" placeholder="Especifique el sustento técnico o administrativo del cambio de estado..." class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-white text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                        </div>

                        <div>
                            <label for="modalObservaciones" class="block font-semibold text-slate-200 mb-1">Observaciones Adicionales</label>
                            <textarea id="modalObservaciones" name="observaciones" rows="2" maxlength="1000" placeholder="Detalles u observaciones complementarias..." class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-white text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                        </div>

                        <div class="p-3 bg-blue-900/20 border border-blue-800/40 rounded-xl flex items-start space-x-2 text-[11px] text-blue-300">
                            <svg class="w-4 h-4 text-blue-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            <span>Esta transición quedará registrada de forma inmutable en el historial de auditoría del comerciante.</span>
                        </div>
                    </div>
                </div>

                <div class="bg-[#101827] px-6 py-4 flex flex-col sm:flex-row-reverse gap-2 border-t border-[#334155]">
                    <button type="submit" id="btnConfirmarEstado" class="inline-flex justify-center items-center px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-xl shadow-lg transition-colors">
                        Confirmar Cambio
                    </button>
                    <button type="button" onclick="cerrarModalEstado()" class="inline-flex justify-center items-center px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl border border-[#334155] transition-colors">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
