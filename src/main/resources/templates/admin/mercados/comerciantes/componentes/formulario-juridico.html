<!-- Formulario Parcial para Persona Jurídica -->
<div id="seccionPersonaJuridica" class="space-y-6 hidden">
    <div class="bg-[#202c3d] p-5 rounded-xl border border-[#334155] space-y-4">
        <h3 class="text-sm font-bold text-white flex items-center space-x-2">
            <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
            <span>Identificación de la Persona Jurídica (SUNAT)</span>
        </h3>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label for="juridicoRuc" class="block text-xs font-medium text-slate-300 mb-1">RUC (11 dígitos) <span class="text-red-400">*</span></label>
                <div class="flex space-x-2">
                    <input type="text" id="juridicoRuc" name="ruc" maxlength="11" pattern="[0-9]{11}" placeholder="Ej. 20601234567"
                           class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-white text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <button type="button" onclick="validarRucOnline()" title="Validar formato / SUNAT"
                            class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-blue-400 border border-[#334155] rounded-xl text-xs font-semibold flex items-center">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    </button>
                </div>
                <p id="msgValidacionRuc" class="text-[11px] mt-1 text-slate-400"></p>
            </div>

            <div class="md:col-span-2">
                <label for="juridicoRazonSocial" class="block text-xs font-medium text-slate-300 mb-1">Razón Social <span class="text-red-400">*</span></label>
                <input type="text" id="juridicoRazonSocial" name="razonSocial" maxlength="255" placeholder="Ej. Asociación de Artesanos de Quinua S.A.C."
                       class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-white text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label for="juridicoNombreComercial" class="block text-xs font-medium text-slate-300 mb-1">Nombre Comercial</label>
                <input type="text" id="juridicoNombreComercial" name="nombreComercial" maxlength="255" placeholder="Ej. Artesanías La Quinua"
                       class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-white text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label for="juridicoTelefono" class="block text-xs font-medium text-slate-300 mb-1">Teléfono Institucional</label>
                <input type="tel" id="juridicoTelefono" name="telefono" maxlength="20" placeholder="Ej. 066312456"
                       class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-white text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label for="juridicoCorreo" class="block text-xs font-medium text-slate-300 mb-1">Correo Institucional</label>
                <input type="email" id="juridicoCorreo" name="correo" maxlength="150" placeholder="contacto@empresa.com"
                       class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-white text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div class="md:col-span-3">
                <label for="juridicoDomicilioFiscal" class="block text-xs font-medium text-slate-300 mb-1">Domicilio Fiscal / Comercial</label>
                <input type="text" id="juridicoDomicilioFiscal" name="domicilioFiscal" maxlength="255" placeholder="Ej. Plaza Mayor N° 102, Quinua, Huamanga"
                       class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-white text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
        </div>
    </div>

    <!-- Representante Legal Inicial -->
    <div class="bg-[#202c3d] p-5 rounded-xl border border-[#334155] space-y-4">
        <h3 class="text-sm font-bold text-white flex items-center space-x-2">
            <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
            <span>Representante Legal Inicial (Acreditado)</span>
        </h3>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label for="repDni" class="block text-xs font-medium text-slate-300 mb-1">DNI del Representante</label>
                <input type="text" id="repDni" name="representanteDni" maxlength="8" pattern="[0-9]{8}" placeholder="Ej. 10234567"
                       class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-white text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label for="repNombres" class="block text-xs font-medium text-slate-300 mb-1">Nombres</label>
                <input type="text" id="repNombres" name="representanteNombres" maxlength="100" placeholder="Ej. Mario"
                       class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-white text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label for="repPaterno" class="block text-xs font-medium text-slate-300 mb-1">Apellido Paterno</label>
                <input type="text" id="repPaterno" name="representanteApellidoPaterno" maxlength="100" placeholder="Ej. Mendoza"
                       class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-white text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label for="repTipo" class="block text-xs font-medium text-slate-300 mb-1">Cargo / Representación</label>
                <select id="repTipo" name="representanteTipo" class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-white text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="REPRESENTANTE_LEGAL">Representante Legal</option>
                    <option value="GERENTE_GENERAL">Gerente General</option>
                    <option value="APODERADO">Apoderado</option>
                    <option value="ADMINISTRADOR">Administrador</option>
                    <option value="OTRO">Otro</option>
                </select>
            </div>

            <div>
                <label for="repInicio" class="block text-xs font-medium text-slate-300 mb-1">Fecha de Inicio de Cargo</label>
                <input type="date" id="repInicio" name="representanteFechaInicio"
                       class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-white text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
        </div>
    </div>
</div>
