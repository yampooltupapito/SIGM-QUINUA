<!-- Formulario Parcial para Persona Natural -->
<div id="seccionPersonaNatural" class="space-y-6">
    <div class="bg-[#202c3d] p-5 rounded-xl border border-[#334155] space-y-4">
        <h3 class="text-sm font-bold text-white flex items-center space-x-2">
            <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            <span>Identificación de la Persona Natural</span>
        </h3>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label for="naturalDni" class="block text-xs font-medium text-slate-300 mb-1">DNI (8 dígitos) <span class="text-red-400">*</span></label>
                <div class="flex space-x-2">
                    <input type="text" id="naturalDni" name="numeroDocumento" maxlength="8" pattern="[0-9]{8}" required placeholder="Ej. 45892314"
                           class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-white text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <button type="button" onclick="validarDniOnline()" title="Validar formato / RENIEC"
                            class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-blue-400 border border-[#334155] rounded-xl text-xs font-semibold flex items-center">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    </button>
                </div>
                <p id="msgValidacionDni" class="text-[11px] mt-1 text-slate-400"></p>
            </div>

            <div>
                <label for="naturalNombres" class="block text-xs font-medium text-slate-300 mb-1">Nombres <span class="text-red-400">*</span></label>
                <input type="text" id="naturalNombres" name="nombres" required maxlength="100" placeholder="Ej. Juan Carlos"
                       class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-white text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label for="naturalPaterno" class="block text-xs font-medium text-slate-300 mb-1">Apellido Paterno <span class="text-red-400">*</span></label>
                <input type="text" id="naturalPaterno" name="apellidoPaterno" required maxlength="100" placeholder="Ej. Quispe"
                       class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-white text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label for="naturalMaterno" class="block text-xs font-medium text-slate-300 mb-1">Apellido Materno</label>
                <input type="text" id="naturalMaterno" name="apellidoMaterno" maxlength="100" placeholder="Ej. Huamán"
                       class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-white text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label for="naturalTelefono" class="block text-xs font-medium text-slate-300 mb-1">Teléfono / Celular</label>
                <input type="tel" id="naturalTelefono" name="telefono" maxlength="20" placeholder="Ej. 966123456"
                       class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-white text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label for="naturalCorreo" class="block text-xs font-medium text-slate-300 mb-1">Correo Electrónico</label>
                <input type="email" id="naturalCorreo" name="correo" maxlength="150" placeholder="ejemplo@quinua.gob.pe"
                       class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-white text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div class="md:col-span-3">
                <label for="naturalDireccion" class="block text-xs font-medium text-slate-300 mb-1">Dirección de Contacto / Residencia</label>
                <input type="text" id="naturalDireccion" name="direccion" maxlength="255" placeholder="Ej. Jr. Sucre s/n, Barrio San Blas, Quinua"
                       class="w-full bg-[#101827] border border-[#334155] rounded-xl px-3 py-2 text-white text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
        </div>
    </div>
</div>
