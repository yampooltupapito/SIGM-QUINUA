<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<div th:fragment="tabsNav(pestanaActiva)" class="border-b border-slate-700/60 pb-3">
    <div class="flex flex-wrap items-center gap-2">
        <a th:href="@{/dashboard/mesa-partes/configuracion/tramites}"
           th:classappend="${pestanaActiva == 'tramites'} ? 'bg-blue-600 text-white shadow-md shadow-blue-900/40' : 'bg-slate-800/80 text-slate-300 hover:bg-slate-700 hover:text-white'"
           class="flex items-center space-x-2 px-3.5 py-2 rounded-xl text-xs font-semibold border border-slate-700/60 transition-all">
            <i data-lucide="folder-tree" class="w-4 h-4"></i>
            <span>Catálogo de Trámites</span>
        </a>

        <a th:href="@{/dashboard/mesa-partes/configuracion/requisitos}"
           th:classappend="${pestanaActiva == 'requisitos'} ? 'bg-blue-600 text-white shadow-md shadow-blue-900/40' : 'bg-slate-800/80 text-slate-300 hover:bg-slate-700 hover:text-white'"
           class="flex items-center space-x-2 px-3.5 py-2 rounded-xl text-xs font-semibold border border-slate-700/60 transition-all">
            <i data-lucide="check-square" class="w-4 h-4"></i>
            <span>Requisitos Documentales</span>
        </a>

        <a th:href="@{/dashboard/mesa-partes/configuracion/formularios}"
           th:classappend="${pestanaActiva == 'formularios'} ? 'bg-blue-600 text-white shadow-md shadow-blue-900/40' : 'bg-slate-800/80 text-slate-300 hover:bg-slate-700 hover:text-white'"
           class="flex items-center space-x-2 px-3.5 py-2 rounded-xl text-xs font-semibold border border-slate-700/60 transition-all">
            <i data-lucide="layout-template" class="w-4 h-4"></i>
            <span>Constructor de Formularios</span>
        </a>

        <a th:href="@{/dashboard/mesa-partes/configuracion/plazos}"
           th:classappend="${pestanaActiva == 'plazos'} ? 'bg-blue-600 text-white shadow-md shadow-blue-900/40' : 'bg-slate-800/80 text-slate-300 hover:bg-slate-700 hover:text-white'"
           class="flex items-center space-x-2 px-3.5 py-2 rounded-xl text-xs font-semibold border border-slate-700/60 transition-all">
            <i data-lucide="clock" class="w-4 h-4"></i>
            <span>Plazos y Unidades</span>
        </a>

        <a th:href="@{/dashboard/mesa-partes/configuracion/calendario}"
           th:classappend="${pestanaActiva == 'calendario'} ? 'bg-blue-600 text-white shadow-md shadow-blue-900/40' : 'bg-slate-800/80 text-slate-300 hover:bg-slate-700 hover:text-white'"
           class="flex items-center space-x-2 px-3.5 py-2 rounded-xl text-xs font-semibold border border-slate-700/60 transition-all">
            <i data-lucide="calendar" class="w-4 h-4"></i>
            <span>Calendario Administrativo</span>
        </a>

        <a th:href="@{/dashboard/mesa-partes/configuracion/numeracion}"
           th:classappend="${pestanaActiva == 'numeracion'} ? 'bg-blue-600 text-white shadow-md shadow-blue-900/40' : 'bg-slate-800/80 text-slate-300 hover:bg-slate-700 hover:text-white'"
           class="flex items-center space-x-2 px-3.5 py-2 rounded-xl text-xs font-semibold border border-slate-700/60 transition-all">
            <i data-lucide="hash" class="w-4 h-4"></i>
            <span>Numeración y Correlativos</span>
        </a>

        <a th:href="@{/dashboard/mesa-partes/configuracion/plantillas}"
           th:classappend="${pestanaActiva == 'plantillas'} ? 'bg-blue-600 text-white shadow-md shadow-blue-900/40' : 'bg-slate-800/80 text-slate-300 hover:bg-slate-700 hover:text-white'"
           class="flex items-center space-x-2 px-3.5 py-2 rounded-xl text-xs font-semibold border border-slate-700/60 transition-all">
            <i data-lucide="file-code" class="w-4 h-4"></i>
            <span>Plantillas Documentales</span>
        </a>

        <a th:href="@{/dashboard/mesa-partes/configuracion/historial}"
           th:classappend="${pestanaActiva == 'historial'} ? 'bg-blue-600 text-white shadow-md shadow-blue-900/40' : 'bg-slate-800/80 text-slate-300 hover:bg-slate-700 hover:text-white'"
           class="flex items-center space-x-2 px-3.5 py-2 rounded-xl text-xs font-semibold border border-slate-700/60 transition-all">
            <i data-lucide="history" class="w-4 h-4"></i>
            <span>Historial y Auditoría</span>
        </a>
    </div>
</div>
</html>
