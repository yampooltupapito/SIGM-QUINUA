<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="h-16 bg-[#1e293b] border-b border-slate-700/60 px-6 flex items-center justify-between sticky top-0 z-40 shadow-sm">
    <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-lg bg-white p-1 flex items-center justify-center shadow-md border border-slate-200 flex-shrink-0">
            <img th:src="@{/images/logo-quinua.jpg}" alt="Logo Oficial Quinua" class="w-full h-full object-contain">
        </div>
        <div>
            <h1 class="text-sm font-bold tracking-wide text-slate-100 uppercase" th:text="${appName}">SIGM-QUINUA</h1>
            <p class="text-xs text-slate-400 font-medium" th:text="${municipality}">Municipalidad Distrital de Quinua</p>
        </div>
    </div>
    <div class="flex items-center space-x-4">
        <div class="flex items-center space-x-2 bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700/60 text-xs text-slate-300">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span class="font-medium">Perfil:</span>
            <span class="text-blue-400 font-semibold" th:text="${profile}">DEV</span>
        </div>
        <div class="flex items-center space-x-2 text-xs text-slate-400">
            <i data-lucide="shield-check" class="w-4 h-4 text-emerald-400"></i>
            <span>Seguridad Activa</span>
        </div>
    </div>
</header>
</body>
</html>
