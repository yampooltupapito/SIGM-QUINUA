<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 - Solicitud Incorrecta | SIGM-QUINUA</title>
    <link rel="stylesheet" th:href="@{/css/tailwind.min.css}">
</head>
<body class="bg-[#101827] text-[#e2e8f0] min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-[#202c3d] border border-slate-700/60 rounded-xl p-8 text-center shadow-2xl">
        <div class="w-16 h-16 rounded-full bg-amber-600/20 border border-amber-500/30 flex items-center justify-center mx-auto mb-4 text-amber-400">
            <i data-lucide="alert-triangle" class="w-8 h-8"></i>
        </div>
        <h1 class="text-3xl font-extrabold text-slate-100">400</h1>
        <h2 class="text-lg font-bold text-slate-200 mt-2">Solicitud Incorrecta</h2>
        <p class="text-sm text-slate-400 mt-2" th:text="${error != null ? error.message : 'Los parámetros enviados en la solicitud no son válidos o están incompletos.'}">
            Los parámetros enviados en la solicitud no son válidos o están incompletos.
        </p>
        <div class="mt-6 flex items-center justify-center space-x-3">
            <a href="/dashboard" class="inline-flex items-center space-x-2 px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-medium text-xs rounded-lg transition-colors shadow-lg shadow-blue-900/30">
                <i data-lucide="home" class="w-4 h-4"></i>
                <span>Ir al Panel Principal</span>
            </a>
            <a href="javascript:history.back()" class="inline-flex items-center space-x-2 px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-xs rounded-lg border border-slate-700 transition-colors">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span>Regresar</span>
            </a>
        </div>
    </div>
    <script th:src="@{/js/lucide.min.js}"></script>
    <script>if (window.lucide) { lucide.createIcons(); }</script>
</body>
</html>
