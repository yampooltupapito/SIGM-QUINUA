<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ==========================================================================
     COMPONENTE CONFIRMATION MODAL (Para operaciones críticas o destructivas)
     ========================================================================== -->
<div th:fragment="confirmationModal(modalId, titulo, mensaje, actionUrl, textoConfirmar)"
     th:id="${!#strings.isEmpty(modalId) ? modalId : 'modalConfirmacionGlobal'}"
     role="dialog"
     aria-modal="true"
     th:attr="aria-labelledby=${(!#strings.isEmpty(modalId) ? modalId : 'modalConfirmacionGlobal') + 'Title'}"
     aria-hidden="true"
     class="modal-container sigm-modal-backdrop fixed inset-0 bg-slate-950/75 z-50 hidden items-center justify-center p-4">
    <div class="sigm-modal-dialog w-full max-w-md animate-fade-in">
        <div class="sigm-modal-header">
            <h3 th:id="${(!#strings.isEmpty(modalId) ? modalId : 'modalConfirmacionGlobal') + 'Title'}"
                class="text-sm font-bold text-slate-100 flex items-center space-x-2">
                <i data-lucide="alert-triangle" class="w-5 h-5 text-rose-400"></i>
                <span data-confirm-title th:text="${!#strings.isEmpty(titulo) ? titulo : 'Confirmar Operación Crítica'}">Confirmar Operación</span>
            </h3>
            <button type="button"
                    th:attr="data-modal-close=${!#strings.isEmpty(modalId) ? modalId : 'modalConfirmacionGlobal'}"
                    onclick="cerrarModal(this.getAttribute('data-modal-close'))"
                    aria-label="Cerrar confirmación"
                    class="text-slate-400 hover:text-white p-1">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>
        <form data-confirm-form th:action="${!#strings.isEmpty(actionUrl) ? actionUrl : '#'}" method="post">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="sigm-modal-body space-y-3 text-xs">
                <p data-confirm-message class="text-slate-300 leading-relaxed"
                   th:text="${!#strings.isEmpty(mensaje) ? mensaje : '¿Está seguro de ejecutar esta operación? Esta acción quedará registrada en la auditoría institucional.'}">
                    ¿Está seguro de continuar?
                </p>
                <div class="p-3 rounded-lg bg-rose-950/30 border border-rose-500/30 text-rose-200 flex items-center space-x-2 text-[11px]">
                    <i data-lucide="shield-alert" class="w-4 h-4 text-rose-400 flex-shrink-0"></i>
                    <span>La operación será registrada con su usuario, fecha y dirección IP.</span>
                </div>
            </div>
            <div class="sigm-modal-footer">
                <button type="button"
                        th:attr="data-modal-close=${!#strings.isEmpty(modalId) ? modalId : 'modalConfirmacionGlobal'}"
                        onclick="cerrarModal(this.getAttribute('data-modal-close'))"
                        class="sigm-btn sigm-btn-secondary">
                    Cancelar
                </button>
                <button type="submit" data-confirm-submit class="sigm-btn sigm-btn-danger">
                    <i data-lucide="check" class="w-3.5 h-3.5"></i>
                    <span th:text="${!#strings.isEmpty(textoConfirmar) ? textoConfirmar : 'Confirmar Acción'}">Confirmar</span>
                </button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
