<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ==========================================================================
     1. PAGINACIÓN SERVIDOR COMPATIBLE CON SPRING DATA Page<?>
     Uso: <div th:replace="~{components/tables/pagination :: pagination(${page}, '/dashboard/mesa-partes/bandeja')}"></div>
     ========================================================================== -->
<div th:fragment="pagination(pageObj, baseUrl)"
     th:if="${pageObj != null and pageObj.totalPages > 0}"
     class="sigm-pagination-bar">
    <p class="text-xs text-slate-400">
        Mostrando página <span class="font-bold text-slate-200 font-mono-code" th:text="${pageObj.number + 1}">1</span>
        de <span class="font-bold text-slate-200 font-mono-code" th:text="${pageObj.totalPages}">1</span>
        (<span class="font-bold text-blue-400 font-mono-code" th:text="${pageObj.totalElements}">0</span> registros en PostgreSQL)
    </p>
    <div class="flex items-center space-x-1.5">
        <a th:if="${pageObj.hasPrevious()}"
           th:href="@{${baseUrl}(page=0, size=${pageObj.size})}"
           aria-label="Primera página"
           class="sigm-btn sigm-btn-secondary px-2.5 py-1">
            <i data-lucide="chevrons-left" class="w-3.5 h-3.5"></i>
        </a>
        <a th:if="${pageObj.hasPrevious()}"
           th:href="@{${baseUrl}(page=${pageObj.number - 1}, size=${pageObj.size})}"
           class="sigm-btn sigm-btn-secondary px-3 py-1">
            <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
            <span>Anterior</span>
        </a>
        <span class="px-3 py-1 rounded-md bg-blue-600/20 border border-blue-500/40 text-blue-300 font-bold font-mono-code text-xs"
              th:text="${pageObj.number + 1}">1</span>
        <a th:if="${pageObj.hasNext()}"
           th:href="@{${baseUrl}(page=${pageObj.number + 1}, size=${pageObj.size})}"
           class="sigm-btn sigm-btn-secondary px-3 py-1">
            <span>Siguiente</span>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
        </a>
        <a th:if="${pageObj.hasNext()}"
           th:href="@{${baseUrl}(page=${pageObj.totalPages - 1}, size=${pageObj.size})}"
           aria-label="Última página"
           class="sigm-btn sigm-btn-secondary px-2.5 py-1">
            <i data-lucide="chevrons-right" class="w-3.5 h-3.5"></i>
        </a>
    </div>
</div>

<!-- ==========================================================================
     2. PAGINACIÓN ESTÁTICA / DEMOSTRACIÓN DE ALTO VOLUMEN (500+ REGISTROS)
     ========================================================================== -->
<div th:fragment="paginationStatic(paginaActual, totalPaginas, totalRegistros)"
     class="sigm-pagination-bar">
    <p class="text-xs text-slate-400">
        Mostrando página <span class="font-bold text-slate-200 font-mono-code" th:text="${paginaActual}">1</span>
        de <span class="font-bold text-slate-200 font-mono-code" th:text="${totalPaginas}">25</span>
        (<span class="font-bold text-blue-400 font-mono-code" th:text="${totalRegistros}">500</span> registros totales)
    </p>
    <div class="flex items-center space-x-1.5">
        <button type="button" disabled class="sigm-btn sigm-btn-secondary px-2.5 py-1">
            <i data-lucide="chevrons-left" class="w-3.5 h-3.5"></i>
        </button>
        <button type="button" disabled class="sigm-btn sigm-btn-secondary px-3 py-1">
            <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
            <span>Anterior</span>
        </button>
        <span class="px-3 py-1 rounded-md bg-blue-600 text-white font-bold font-mono-code text-xs" th:text="${paginaActual}">1</span>
        <button type="button" class="sigm-btn sigm-btn-secondary px-3 py-1 font-mono-code">2</button>
        <button type="button" class="sigm-btn sigm-btn-secondary px-3 py-1 font-mono-code">3</button>
        <span class="text-slate-500 px-1">...</span>
        <button type="button" class="sigm-btn sigm-btn-secondary px-3 py-1 font-mono-code" th:text="${totalPaginas}">25</button>
        <button type="button" class="sigm-btn sigm-btn-secondary px-3 py-1">
            <span>Siguiente</span>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
        </button>
    </div>
</div>

</body>
</html>
