<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ==========================================================================
     COMPONENTE LOADING STATE (Indicador visual de carga)
     ========================================================================== -->
<div th:fragment="loadingState(titulo, subtitulo)"
     role="status"
     aria-live="polite"
     class="py-10 px-6 text-center bg-card/70 rounded-xl border border-theme">
    <div class="w-11 h-11 rounded-full bg-blue-600/15 border border-blue-500/30 flex items-center justify-center mx-auto mb-3 text-blue-400">
        <i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>
    </div>
    <h3 class="text-sm font-bold text-slate-200" th:text="${!#strings.isEmpty(titulo) ? titulo : 'Procesando consulta...'}">Cargando...</h3>
    <p class="text-xs text-slate-400 mt-1" th:text="${!#strings.isEmpty(subtitulo) ? subtitulo : 'Consultando registros en PostgreSQL.'}">Por favor espere</p>
</div>

</body>
</html>
