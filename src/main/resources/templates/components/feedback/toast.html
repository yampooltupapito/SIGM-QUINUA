<!DOCTYPE html>

<body>

<!-- ==========================================================================
     CONTENEDOR DE NOTIFICACIONES FLOTANTES (Toast Container)

     id="toastContainer"
     role="region"
     aria-live="assertive"
     aria-label="Notificaciones del sistema"
