<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ==========================================================================
     COMPONENTE CHECKBOX ACCESIBLE (Checkbox)
     ========================================================================== -->
<label th:fragment="checkbox(id, name, label, checked, descripcion)"
       th:for="${id}"
       class="inline-flex items-start gap-2.5 cursor-pointer select-none">
    <input type="checkbox"
           th:id="${id}"
           th:name="${name}"
           th:checked="${checked}"
           class="sigm-checkbox mt-0.5"/>
    <span class="text-xs">
        <span class="font-semibold text-slate-200 block" th:text="${label}">Opción</span>
        <span th:if="${!#strings.isEmpty(descripcion)}" class="text-[11px] text-slate-400 block mt-0.5" th:text="${descripcion}">Detalle</span>
    </span>
</label>

</body>
</html>
