<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{portal/portal-layout}">
<head>
    <title>Seguimiento de Alerta Ciudadana — Serenazgo Quinua</title>
</head>
<body>
<div layout:fragment="content" class="py-12 bg-slate-50 min-h-screen">
    <div class="max-w-xl mx-auto px-4 sm:px-6">

        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-blue-100 text-blue-700 mb-3 shadow-inner">
                <i data-lucide="search" class="w-6 h-6"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">Seguimiento de Alerta Ciudadana</h1>
            <p class="text-xs text-slate-500 mt-1">
                Consulta el estado administrativo, requerimientos y resoluciones de tu reporte preventivo.
            </p>
        </div>

        <!-- Tarjeta de Búsqueda -->
        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 sm:p-8">

            <div th:if="${mensajeError}" class="mb-6 p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
                <span th:text="${mensajeError}">Código o clave de consulta inválida.</span>
            </div>

            <form th:action="@{/portal/seguridad/seguimiento}" th:object="${consulta}" method="POST" class="space-y-4">

                <div>
                    <label class="block text-xs font-semibold text-slate-700">Código de Seguimiento <span class="text-rose-500">*</span></label>
                    <div class="relative mt-1">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="hash" class="w-4 h-4"></i>
                        </div>
                        <input type="text" th:field="*{codigo}" required placeholder="Ej: ALT-2026-00001" uppercase class="w-full pl-9 text-xs font-mono font-bold uppercase rounded-xl border border-slate-300 py-2.5 px-3 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700">Clave Secreta de Consulta (PIN de 6 caracteres)</label>
                    <div class="relative mt-1">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="key" class="w-4 h-4"></i>
                        </div>
                        <input type="text" th:field="*{pinConsulta}" maxlength="10" placeholder="Ej: A7K92M (Opcional si iniciaste sesión)" class="w-full pl-9 text-xs font-mono font-bold uppercase rounded-xl border border-slate-300 py-2.5 px-3 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <span class="text-[10px] text-slate-400 mt-1 block">Si estás autenticado con la cuenta creadora, el PIN no es obligatorio.</span>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold transition flex items-center justify-center gap-2 shadow-md shadow-blue-600/20">
                        <i data-lucide="search" class="w-4 h-4"></i>
                        <span>Consultar Estado</span>
                    </button>
                </div>
            </form>

            <div sec:authorize="isAuthenticated()" class="mt-6 pt-6 border-t border-slate-100 text-center">
                <a th:href="@{/portal/seguridad/mis-reportes}" class="text-xs font-semibold text-blue-600 hover:underline flex items-center justify-center gap-1.5">
                    <i data-lucide="list" class="w-4 h-4"></i>
                    <span>Ver todos mis reportes registrados</span>
                </a>
            </div>

        </div>

    </div>
</div>

<th:block layout:fragment="scripts">
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (window.lucide) {
                lucide.createIcons();
            }
        });
    </script>
</th:block>
</body>
</html>
