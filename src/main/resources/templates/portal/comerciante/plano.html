<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{portal/comerciante/layout}">
<head>
    <title>Plano del Mercado</title>
</head>
<body>
<div layout:fragment="content" class="space-y-6">

    <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
            <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">Plano Cartográfico del Mercado</h1>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">
                Visualización del plano publicado oficial con la ubicación exacta de sus puestos comerciales.
            </p>
        </div>

        <!-- Selector de Puesto para Resaltar -->
        <div class="flex items-center gap-2">
            <label for="selectPuestoPlano" class="text-xs font-semibold text-slate-700 whitespace-nowrap">Resaltar Puesto:</label>
            <select id="selectPuestoPlano" onchange="resaltarPuestoEnPlano(this.value)" class="bg-slate-50 border border-slate-300 text-slate-800 text-xs rounded-lg px-3 py-2 font-medium focus:ring-blue-500 focus:border-blue-500">
                <option value="">-- Ver Todo el Mercado --</option>
                <option th:each="p : ${puestos}" th:value="${p.codigoPuesto}" th:text="${'Puesto ' + p.codigoPuesto + ' (' + p.mercadoNombre + ')'}"></option>
            </select>
        </div>
    </div>

    <!-- Visor del Plano -->
    <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
        <div id="contenedorPlano" class="w-full h-96 sm:h-[500px] bg-slate-100 rounded-lg flex items-center justify-center border border-slate-300 overflow-hidden relative">
            <svg id="svgPlanoMercado" viewBox="0 0 1000 600" class="w-full h-full">
                <!-- Capa de Fondo del Mercado -->
                <rect x="20" y="20" width="960" height="560" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
                <text x="50" y="55" fill="#475569" font-size="16" font-weight="bold">MERCADO CENTRAL DE QUINUA — PLANTA GENERAL</text>

                <!-- Sectores y Pasadizos -->
                <rect x="50" y="80" width="420" height="460" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
                <text x="65" y="105" fill="#334155" font-size="12" font-weight="bold">SECTOR A: ABARROTES Y FRUTAS</text>

                <rect x="520" y="80" width="430" height="460" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
                <text x="535" y="105" fill="#334155" font-size="12" font-weight="bold">SECTOR B: CARNES, AVES Y COMIDAS</text>

                <!-- Puestos Sector A -->
                <g id="puestosSectorA">
                    <rect id="puesto-P-01" class="puesto-rect cursor-pointer transition-all hover:opacity-80" x="70" y="130" width="80" height="60" rx="4" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
                    <text x="95" y="165" fill="#ffffff" font-size="12" font-weight="bold" font-family="monospace">P-01</text>

                    <rect id="puesto-P-02" class="puesto-rect cursor-pointer transition-all hover:opacity-80" x="170" y="130" width="80" height="60" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
                    <text x="195" y="165" fill="#475569" font-size="12" font-weight="bold" font-family="monospace">P-02</text>

                    <rect id="puesto-P-03" class="puesto-rect cursor-pointer transition-all hover:opacity-80" x="270" y="130" width="80" height="60" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
                    <text x="295" y="165" fill="#475569" font-size="12" font-weight="bold" font-family="monospace">P-03</text>

                    <rect id="puesto-P-04" class="puesto-rect cursor-pointer transition-all hover:opacity-80" x="370" y="130" width="80" height="60" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
                    <text x="395" y="165" fill="#475569" font-size="12" font-weight="bold" font-family="monospace">P-04</text>
                </g>

                <!-- Pasadizo Central -->
                <text x="495" y="320" fill="#94a3b8" font-size="11" font-weight="bold" transform="rotate(-90 495,320)">PASADIZO PRINCIPAL</text>
            </svg>

            <!-- Leyenda Inferior -->
            <div class="absolute bottom-4 left-4 bg-white/90 backdrop-blur-sm border border-slate-200 rounded-lg p-2.5 text-xs flex items-center gap-4 shadow-sm">
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 bg-blue-600 rounded"></span> Su Puesto Asignado</span>
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 bg-slate-200 border border-slate-300 rounded"></span> Otros Puestos</span>
            </div>
        </div>
    </div>

</div>

<th:block layout:fragment="page-scripts">
    <script>
        function resaltarPuestoEnPlano(codigo) {
            document.querySelectorAll('.puesto-rect').forEach(el => {
                if (el.id === 'puesto-' + codigo) {
                    el.setAttribute('fill', '#f59e0b');
                    el.setAttribute('stroke', '#d97706');
                    el.setAttribute('stroke-width', '3');
                } else if (el.id === 'puesto-P-01') {
                    el.setAttribute('fill', '#3b82f6');
                    el.setAttribute('stroke', '#1d4ed8');
                    el.setAttribute('stroke-width', '1.5');
                } else {
                    el.setAttribute('fill', '#e2e8f0');
                    el.setAttribute('stroke', '#94a3b8');
                    el.setAttribute('stroke-width', '1.5');
                }
            });
        }
    </script>
</th:block>
</body>
</html>
