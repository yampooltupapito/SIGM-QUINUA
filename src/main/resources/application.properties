# ==============================================================================
# CONFIGURACIÓN GENERAL SIGM-QUINUA
# Municipalidad Distrital de Quinua, Huamanga, Ayacucho, Perú
# ==============================================================================
spring.application.name=SIGM-QUINUA
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Servidor Web
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ==============================================================================
# CONEXIÓN POSTGRESQL (Base de datos: sigm_quinua)
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:sigm_quinua}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:jkbnmt09}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de Conexiones HikariCP Optimizado
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:15}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:4}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=15000
spring.datasource.hikari.pool-name=HikariPool-SigmQuinua

# ==============================================================================
# JPA / HIBERNATE - OPTIMIZACIONES DE RENDIMIENTO
# ==============================================================================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=30
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# ==============================================================================
# CACHÉ LOCAL EN MEMORIA (CATÁLOGOS ESTABLES)
# ==============================================================================
spring.cache.cache-names=catalogoTiposTramite,rolesInstitucionales,oficinasMunicipales,sectoresMercados

# ==============================================================================
# MIGRACIONES FLYWAY
# ==============================================================================
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.locations=classpath:db/migration

# ==============================================================================
# FRONTEND / THYMELEAF
# ==============================================================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# ==============================================================================
# ACTUATOR & MONITOREO
# ==============================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ==============================================================================
# SEGURIDAD Y JWT (SIGM-QUINUA)
# ==============================================================================
sigm.security.jwt.secret=${JWT_SECRET:sigm-quinua-municipalidad-distrital-quinua-huamanga-ayacucho-secret-key-2026-secure-token-sha256}
sigm.security.jwt.access-token-expiration-ms=${JWT_EXPIRATION_MS:900000}
sigm.security.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
sigm.security.jwt.issuer=SIGM-QUINUA
sigm.security.max-failed-login-attempts=5

# ==============================================================================
# NOTIFICACIONES Y CORREO ELECTRÓNICO (SIGM-QUINUA)
# ==============================================================================
sigm.mail.enabled=${MAIL_ENABLED:false}
sigm.mail.from=${MAIL_FROM:no-reply@quinua.gob.pe}
sigm.mail.from-name=${MAIL_FROM_NAME:Municipalidad Distrital de Quinua}
sigm.mail.provider=${MAIL_PROVIDER:mock}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==============================================================================
# GESTIÓN DOCUMENTAL CENTRALIZADA (SIGM-QUINUA)
# ==============================================================================
sigm.document.storage.path=${DOCUMENT_STORAGE_PATH:./storage/documentos}
sigm.document.max-file-size=${DOCUMENT_MAX_FILE_SIZE:26214400}
sigm.document.allowed-extensions=pdf,jpeg,jpg,png,webp,docx,xlsx
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB


